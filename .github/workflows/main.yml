
name: Mirai Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            .mirai-build/
            albite/
            output-android/
            ~/.cache/pip/
          key: ${{ runner.os }}-mirai-android-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-mirai-android-

      - name: Build Mirai for Android
        run: python build.py android

      - name: Prepare Minecraft pack
        run: |
          mkdir -p staging/materials
          cp -r pack/. staging/
          cp -r output-android/. staging/materials/

      - name: Create MCpack
        run: |
          cd staging
          zip -r ../mirai-android.mcpack .

      - name: Upload MCpack
        uses: actions/upload-artifact@v4
        with:
          name: mirai-android-mcpack
          path: mirai-android.mcpack
          if-no-files-found: error

      - name: Upload compiled materials
        uses: actions/upload-artifact@v4
        with:
          name: mirai-android-materials
          path: output-android/
          if-no-files-found: error
          
